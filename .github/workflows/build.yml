name: Build

on: [push, pull_request, workflow_dispatch]

env:
  CIBW_ARCHS: auto64
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: "python -m pytest {project}/test/test_import.py"

jobs:
  build_wheels:
    name: Build wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./wheelhouse/*.whl

  build_legacy_wheels:
    name: Build legacy wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v1.12.0
        env:
          CIBW_BUILD: cp27-* cp35-*

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
